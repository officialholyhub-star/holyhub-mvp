name: HolyHub CI

on:
  push:
    branches: [main, alea/stage4-payments, anais/n18-crm-sandbox]
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ueqwzpuiuidihzhtbmvo.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_gqqRT-QTD1D1gAWLWr5Wig_LNMx7B44
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      CRM_ENVIRONMENT: sandbox
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate CRM migration artifact
        if: github.ref == 'refs/heads/anais/n18-crm-sandbox'
        env:
          CRM_DATABASE_URL: postgresql://crm:crm@localhost:5432/holyhub_crm
        run: npm run crm:generate

      - name: Upload generated CRM migration artifact
        if: github.ref == 'refs/heads/anais/n18-crm-sandbox'
        uses: actions/upload-artifact@v4
        with:
          name: n18-crm-generated-migrations
          path: db/crm/migrations
          if-no-files-found: error

      - name: Contract and unit tests
        run: node --test tests/*.test.mjs

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

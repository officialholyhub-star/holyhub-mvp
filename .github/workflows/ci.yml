name: HolyHub CI

on:
  push:
    branches: [main, alea/stage4-payments]
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ueqwzpuiuidihzhtbmvo.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_gqqRT-QTD1D1gAWLWr5Wig_LNMx7B44
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Contract and unit tests
        run: node --test tests/*.test.mjs

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

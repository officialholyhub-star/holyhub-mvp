name: N18 CRM migration sync

on:
  push:
    branches: [anais/n18-crm-sandbox]
    paths:
      - lib/crm/db/schema.ts
      - drizzle.crm.config.ts
      - package.json
      - .github/workflows/n18-crm-migration-sync.yml

permissions:
  contents: write

jobs:
  generate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out N18 branch
        uses: actions/checkout@v4
        with:
          ref: anais/n18-crm-sandbox

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies and refresh lockfile
        run: npm install --no-audit --no-fund

      - name: Generate Drizzle migration
        env:
          CRM_DATABASE_URL: postgresql://crm:crm@localhost:5432/holyhub_crm
        run: npm run crm:generate

      - name: Commit generated migration and lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json db/crm/migrations
          if git diff --cached --quiet; then
            echo "No generated migration changes to commit."
            exit 0
          fi
          git commit -m "Generate N18 CRM migration metadata [skip ci]"
          git push origin HEAD:anais/n18-crm-sandbox

name: Unpack HolyHub Stage 1

on:
  # Historical import, manual-only: automatically unpacking Stage 1 would overwrite the MVP.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack Stage 1 into repository root
        run: |
          rm -rf .stage1-unpack
          mkdir .stage1-unpack
          unzip -q holyhub-stage1-connected.zip -d .stage1-unpack
          cp -R .stage1-unpack/holyhub-stage1/. .
          rm -rf .stage1-unpack
          rm -f .env.local
          rm -f holyhub-stage1-connected.zip

      - name: Commit unpacked project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Unpack HolyHub Stage 1 foundation"
          git push
